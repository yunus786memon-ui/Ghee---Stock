<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#128C7E"><title>Ghee Stock</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2f5f4;color:#17211b}header{background:#128C7E;color:white;padding:15px;position:sticky;top:0}h2{margin:0 0 5px;font-size:20px}.bar{display:flex;gap:8px;margin-top:10px}select,button,input{border:0;border-radius:9px;padding:10px;font-size:15px}select{flex:1}button{background:#25D366;color:white;font-weight:bold}.wrap{max-width:700px;margin:auto;padding:8px}.card{background:white;margin:8px 0;padding:11px;border-radius:12px;box-shadow:0 1px 4px #0002}.name{font-weight:bold}.mat{font-size:12px;color:#667;margin:3px 0 8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grid label{font-size:10px;color:#667}.grid input{width:100%;margin-top:3px;text-align:center;background:#fff4c9;border:1px solid #ddd}.grid input[readonly]{background:#eaf5ec}.diff{margin-top:8px;padding:7px;background:#e5f5e9;border-radius:7px;text-align:right;font-weight:bold}.bad{background:#ffdede;color:#a00}.note{font-size:12px;color:#667;text-align:center;padding:15px}@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><h2>🧈 Ghee Stock WhatsApp Tool</h2><div>Enter Qty → Difference Auto → WhatsApp</div><div class="bar"><select id="time" onchange="load()"><option>9 AM</option><option>12 PM</option><option>2 PM</option><option>4 PM</option><option>6 PM</option><option>8 PM</option></select><button onclick="wa()">📲 WhatsApp</button></div></header><main class="wrap" id="list"></main><div class="note">9 AM Opening manually enter karein. Baaki times ka Opening previous Physical se aayega.</div><script>const A=[['400000157','AMUL GHEE POUCH (500ML)'],['400001345','GOWARDHAN GHEE POUCH (1L)'],['400001346','GOWARDHAN AGM GHEE POUCH (500 ML)'],['400002965','SAGAR PURE GHEE POUCH (500ML)'],['400003931','SAGAR PURE GHEE POUCH (1L)'],['400003932','AMUL GHEE POUCH (1L)'],['400010586','AMUL PURE COW GHEE POUCH (500ML)'],['400021082','AMUL COW GHEE POUCH (1L)'],['400030917','MILKY MIST GHEE POUCH (1L)']];const T=['9 AM','12 PM','2 PM','4 PM','6 PM','8 PM'];function k(t){return'g_'+t.replace(' ','_')}function dat(t){return JSON.parse(localStorage.getItem(k(t))||'null')||A.map(()=>({o:0,r:0,s:0,p:0}))}function save(t,d){localStorage.setItem(k(t),JSON.stringify(d))}function load(){let t=time.value,i=T.indexOf(t),d=dat(t);if(i){let p=dat(T[i-1]);d.forEach((x,n)=>x.o=+p[n].p||0)}list.innerHTML=A.map((a,n)=>{let x=d[n],q=x.o+x.r-x.s-x.p;return `<section class="card"><div class="name">${a[1]}</div><div class="mat">Material: ${a[0]}</div><div class="grid"><label>OPENING<input id="o${n}" type="number" value="${x.o}" ${i?'readonly':''} onchange="up(${n},'o',this.value)"></label><label>REFILL<input id="r${n}" type="number" value="${x.r}" onchange="up(${n},'r',this.value)"></label><label>SALE<input id="s${n}" type="number" value="${x.s}" onchange="up(${n},'s',this.value)"></label><label>PHYSICAL<input id="p${n}" type="number" value="${x.p}" onchange="up(${n},'p',this.value)"></label></div><div id="d${n}" class="diff ${q?'bad':''}">Difference: ${q}</div></section>`}).join('')}function up(n,c,v){let t=time.value,d=dat(t);d[n][c]=+v||0;save(t,d);let q=d[n].o+d[n].r-d[n].s-d[n].p,e=document.getElementById('d'+n);e.textContent='Difference: '+q;e.className='diff '+(q?'bad':'')}function wa(){let t=time.value,d=dat(t),m='🧈 GHEE STOCK – '+t+'\n━━━━━━━━━━━━━━━━\n';A.forEach((a,n)=>{let x=d[n],q=x.o+x.r-x.s-x.p;m+='*'+a[0]+' | '+a[1]+'*\nO: '+x.o+'  R: '+x.r+'  S: '+x.s+'  P: '+x.p+'  D: '+q+'\n────────────────\n'});location.href='https://wa.me/?text='+encodeURIComponent(m)}load();</script></body></html>
