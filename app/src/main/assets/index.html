<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#128C7E"><title>Ghee Stock</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f5f4;font-family:Arial,sans-serif;color:#17211b}header{background:#128C7E;color:#fff;padding:16px;position:sticky;top:0;z-index:5}h1{font-size:20px;margin:0 0 10px}.sub{font-size:13px;opacity:.9}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}select,button{border:0;border-radius:10px;padding:11px 13px;font-size:14px}select{background:#fff;color:#111;flex:1;min-width:110px}button{font-weight:700}.wa{background:#25D366;color:#fff}.reset{background:#e9ecef;color:#222}.wrap{padding:10px;max-width:700px;margin:auto}.card{background:#fff;border-radius:14px;margin:9px 0;padding:12px;box-shadow:0 1px 4px #0001}.name{font-weight:700;font-size:15px}.mat{font-size:12px;color:#667;margin-top:2px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}label{font-size:10px;color:#667;font-weight:700}input{width:100%;padding:10px 5px;border:1px solid #ccd5d2;border-radius:8px;font-size:16px;text-align:center;margin-top:3px;background:#fff8d8}input.open{background:#eef7ef}.diff{margin-top:9px;padding:8px;border-radius:8px;background:#e9f7ed;font-weight:700;text-align:right}.bad{background:#ffe8e8;color:#b00020}.footer{padding:8px 10px 22px;color:#667;font-size:12px;text-align:center}@media(max-width:430px){.grid{grid-template-columns:repeat(2,1fr)}}</style>
</head><body><header><h1>🧈 Ghee Stock WhatsApp Tool</h1><div class="sub">Qty enter karo → Difference automatic → WhatsApp Send</div><div class="bar"><select id="time" onchange="loadTime()"><option>9 AM</option><option>12 PM</option><option>2 PM</option><option>4 PM</option><option>6 PM</option><option>8 PM</option></select><button class="wa" onclick="sendWA()">📲 Send WhatsApp</button><button class="reset" onclick="clearCurrent()">Clear</button></div></header><div class="wrap" id="list"></div><div class="footer">9 AM ka Opening manually bharo. Baaki time par Opening previous time ki Physical se automatically aayegi.</div>
<script>
const articles=[["400000157","AMUL GHEE POUCH (500ML)"],["400001345","GOWARDHAN GHEE POUCH (1L)"],["400001346","GOWARDHAN AGM GHEE POUCH (500 ML)"],["400002965","SAGAR PURE GHEE POUCH (500ML)"],["400003931","SAGAR PURE GHEE POUCH (1L)"],["400003932","AMUL GHEE POUCH (1L)"],["400010586","AMUL PURE COW GHEE POUCH (500ML)"],["400021082","AMUL COW GHEE POUCH (1L)"],["400030917","MILKY MIST GHEE POUCH (1L)"]];
const times=["9 AM","12 PM","2 PM","4 PM","6 PM","8 PM"];const key=t=>"ghee_"+t.replace(" ","_");function data(t){return JSON.parse(localStorage.getItem(key(t))||"null")||articles.map(()=>({o:0,r:0,s:0,p:0}))}function save(t,d){localStorage.setItem(key(t),JSON.stringify(d))}
function loadTime(){const t=document.getElementById("time").value,d=data(t),idx=times.indexOf(t);if(idx>0){const prev=data(times[idx-1]);d.forEach((x,i)=>x.o=Number(prev[i].p)||0)}const box=document.getElementById("list");box.innerHTML="";articles.forEach((a,i)=>{const x=d[i],diff=Number(x.o)+Number(x.r)-Number(x.s)-Number(x.p);box.innerHTML+=`<div class="card"><div class="name">${a[1]}</div><div class="mat">Material: ${a[0]}</div><div class="grid"><div><label>OPENING</label><input class="open" id="o${i}" type="number" min="0" value="${x.o}" ${idx>0?'readonly':''} onchange="upd(${i},'o',this.value)"></div><div><label>REFILL</label><input id="r${i}" type="number" min="0" value="${x.r}" onchange="upd(${i},'r',this.value)"></div><div><label>SALE</label><input id="s${i}" type="number" min="0" value="${x.s}" onchange="upd(${i},'s',this.value)"></div><div><label>PHYSICAL</label><input id="p${i}" type="number" min="0" value="${x.p}" onchange="upd(${i},'p',this.value)"></div></div><div id="d${i}" class="diff ${diff!==0?'bad':''}">Difference: ${diff}</div></div>`})}
function upd(i,k,v){const t=document.getElementById("time").value,d=data(t);d[i][k]=Number(v)||0;save(t,d);const diff=d[i].o+d[i].r-d[i].s-d[i].p,el=document.getElementById("d"+i);el.textContent="Difference: "+diff;el.className="diff "+(diff!==0?"bad":"")}
function clearCurrent(){if(confirm("Is time ka data clear karna hai?")){localStorage.removeItem(key(document.getElementById("time").value));loadTime()}}
function sendWA(){const t=document.getElementById("time").value,d=data(t);let msg="🧈 GHEE STOCK – "+t+"\n━━━━━━━━━━━━━━━━\n";articles.forEach((a,i)=>{const x=d[i],diff=x.o+x.r-x.s-x.p;msg+="*"+a[0]+" | "+a[1]+"*\n";msg+="O: "+x.o+"  R: "+x.r+"  S: "+x.s+"  P: "+x.p+"  D: "+diff+"\n────────────────\n"});msg+="Ghee Stock Update";window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank")}
loadTime();
</script></body></html>
